<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram</title>
</head>

<body
  style="background-color: #000000; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column;">

  <main style="flex-grow: 1; display: flex; justify-content: center; align-items: center; padding-bottom: 30px;">

    <div
      style="display: flex; justify-content: center; align-items: center; width: 100%; max-width: 1400px; gap: 170px;">

      <div
        style="display: none; height: 581px; flex-basis: 380px; background-image: url('img/instagram_phones.png'); background-size: contain; background-repeat: no-repeat; background-position: center;">
      </div>

      <div style="width: 350px; flex-shrink: 0;">

        <div
          style="border: 1px solid #363636; background-color: #000000; padding: 40px 40px; margin-bottom: 10px; text-align: center;">
          <h1
            style="font-family: 'Billabong', 'Grand Hotel', 'Brush Script MT', cursive; font-size: 3rem; margin: 0 0 32px 0; font-weight: normal;">
            Instagram</h1>

          <form action="" style="display: flex; flex-direction: column; gap: 6px;">
            <input type="text" placeholder="Phone number, username, or email"
              style="background-color: #121212; border: 1px solid #363636; border-radius: 3px; color: #fafafa; font-size: 14px; padding: 9px 8px; outline: none; width: 100%; box-sizing: border-box;"
              onfocus="this.style.borderColor='#a8a8a8'" onblur="this.style.borderColor='#363636'">

            <input type="password" placeholder="Password"
              style="background-color: #121212; border: 1px solid #363636; border-radius: 3px; color: #fafafa; font-size: 14px; padding: 9px 8px; outline: none; width: 100%; box-sizing: border-box;"
              onfocus="this.style.borderColor='#a8a8a8'" onblur="this.style.borderColor='#363636'">

            <button type="submit"
              style="background-color: #0095f6; border: none; border-radius: 8px; color: #fff; font-weight: 600; font-size: 14px; padding: 7px 16px; margin-top: 8px; cursor: pointer; width: 100%;">Log
              in</button>
          </form>

          <div style="display: flex; align-items: center; margin: 20px 0 24px;">
            <div style="height: 1px; background-color: #363636; flex-grow: 1;"></div>
            <div style="color: #a8a8a8; font-size: 13px; font-weight: 600; margin: 0 18px;">OR</div>
            <div style="height: 1px; background-color: #363636; flex-grow: 1;"></div>
          </div>

          <div style="margin-bottom: 18px;">
            <button
              style="background: none; border: none; color: #385185; font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 100%;">
              <span style="display: inline-block; margin-right: 8px; font-weight: bold; font-size: 18px;">f</span> Log
              in with Facebook
            </button>
          </div>

          <a href="#" style="color: #a8a8a8; font-size: 12px; text-decoration: none;">Forgot password?</a>
        </div>

        <div
          style="border: 1px solid #363636; background-color: #000000; padding: 20px; text-align: center; margin-bottom: 10px;">
          <span style="font-size: 14px; color: #ffffff;">Don't have an account? <a href="#"
              style="color: #0095f6; text-decoration: none; font-weight: 600;">Sign up</a></span>
        </div>

        <div style="text-align: center;">
          <p style="font-size: 14px; margin: 10px 0 20px;">Get the app.</p>
        </div>
      </div>
    </div>
  </main>

  <footer style="padding: 0 20px 30px;">
    <div
      style="display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; margin-bottom: 20px; font-size: 12px; color: #737373;">
      <a href="#" style="color: #737373; text-decoration: none;">Meta</a>
      <a href="#" style="color: #737373; text-decoration: none;">About</a>
      <a href="#" style="color: #737373; text-decoration: none;">Blog</a>
      <a href="#" style="color: #737373; text-decoration: none;">Jobs</a>
      <a href="#" style="color: #737373; text-decoration: none;">Help</a>
      <a href="#" style="color: #737373; text-decoration: none;">API</a>
      <a href="#" style="color: #737373; text-decoration: none;">Privacy</a>
      <a href="#" style="color: #737373; text-decoration: none;">Terms</a>
      <a href="#" style="color: #737373; text-decoration: none;">Locations</a>
      <a href="#" style="color: #737373; text-decoration: none;">Instagram Lite</a>
      <a href="#" style="color: #737373; text-decoration: none;">Threads</a>
      <a href="#" style="color: #737373; text-decoration: none;">Contact Uploading & Non-Users</a>
      <a href="#" style="color: #737373; text-decoration: none;">Meta Verified</a>
    </div>

    <div style="text-align: center; font-size: 12px; color: #737373;">
      <span style="margin-right: 16px;">English (UK) <span style="font-size: 10px;">&#9660;</span></span>
      <span>&copy; 2026 Instagram from Meta</span>
    </div>

    <div style="text-align: center; margin-top: 20px; font-size: 12px; color: #737373;">
      <hr style="border-color: #363636; margin-bottom: 10px;">
      <strong>Pembuat: Bilal Alaudin</strong>
      <p>Copyright &copy; Bilal Alaudin</p>
    </div>
  </footer>

  <style>
    @media (min-width: 800px) {
      div[style*="background-image: url"] {
        display: block !important;
      }
    }

    @font-face {
      font-family: 'Billabong';
      src: local('Billabong'), url('https://fonts.cdnfonts.com/s/13936/Billabong.woff') format('woff');
    }
  </style>
</body>

</html>
